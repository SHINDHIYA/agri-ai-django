{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Green Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f5fff4;
        }

        /* Header */
        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
        }

        .logout-btn {
            background-color: #66bb6a;
            color: white;
            padding: 8px 18px;
            margin-left: 10px;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .logout-btn:hover {
            background-color: #4caf50;
        }

        h3 {
            text-align: center;
            color: #388e3c;
            margin: 30px 0 20px;
            font-size: 28px;
        }

        /* Product List */
        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 0 50px 50px;
        }

        .product-item {
            background-color: white;
            border: 2px solid #c8e6c9;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 128, 0, 0.1);
            width: 280px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .product-item:hover {
            transform: translateY(-5px);
        }

        .product-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #e0f2f1;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-info h4 {
            margin: 0 0 10px;
            font-size: 20px;
            color: #2e7d32;
        }

        .product-info p {
            font-size: 14px;
            color: #555;
            margin: 0 0 8px;
        }

        .price {
            font-weight: bold;
            color: #1b5e20;
            margin-top: auto;
        }

        .buy-btn {
            background-color: #43a047;
            color: white;
            padding: 10px;
            margin: 15px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .buy-btn:hover {
            background-color: #2e7d32;
        }

        /* Responsive */
        @media screen and (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-btn {
                margin: 10px 0 0;
            }

            .product-list {
                padding: 0 20px 40px;
            }
        }
    </style>
</head>
<body>
     <div class="d-flex align-items-center me-3">
                <div id="google_translate_element"></div>
            </div>
     <div id="google_translate_element" style="position: fixed; top: 10px; right: 10px; z-index: 9999;"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,ta',
    layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
  }, 'google_translate_element');
}
</script>

<script type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

    <!-- Header -->
    <header>
        <h2>Welcome {{ user.username }}</h2>
        <div>
            <a href="{% url 'home' %}" class="logout-btn">Home</a>
            <a href="{% url 'customer-profile' %}" class="logout-btn">Profile</a>
            <a href="{% url 'logout_view' %}" class="logout-btn">Logout</a>
        </div>
    </header>

    <!-- Title -->
    <h3>🌿 Available Green Products</h3>

    <!-- Product List -->
    <div class="product-list">
        {% for product in products %}
        <div class="product-item">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            {% else %}
                <img src="https://via.placeholder.com/280x180?text=No+Image" alt="No Image">
            {% endif %}
            <div class="product-info">
                <h4>{{ product.name }}</h4>
                <p>{{ product.description }}</p>
                <p class="price">₹{{ product.price }}</p>
            </div>
            <a href="{% url 'buy-product' product.id %}" class="buy-btn">Buy Now</a>
        </div>
        {% endfor %}
    </div>

</body>
</html>
