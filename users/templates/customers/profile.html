<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: url('https://www.soilassociation.org/media/5837/potatoes-being-dug-in-field.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        .profile-card {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #2e7d32;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: 80px auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #2e7d32;
            margin-bottom: 10px;
        }

        .profile-title {
            color: #1b5e20;
            font-weight: bold;
        }

        .form-control {
            margin-bottom: 15px;
        }

        .btn-save {
            background-color: #2e7d32;
            color: white;
        }

        .form-control-file {
            display: inline-block;
            background-color: #f1f8e9;
            border: 1px solid #c8e6c9;
            border-radius: 5px;
            padding: 8px;
            margin-top: 10px;
        }

        label {
            text-align: left;
            width: 100%;
            font-weight: 500;
            margin-bottom: 5px;
            color: #2e7d32;
        }
    </style>
</head>
<body>
         <div id="google_translate_element" style="position: fixed; top: 10px; right: 10px; z-index: 9999;"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,ta',
    layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
  }, 'google_translate_element');
}
</script>

<script type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="profile-card text-center">
            <h3 class="profile-title">{{ customer.user.username }}</h3>

            <div class="text-center">
                <img src="{{ customer.profile_image.url }}" alt="Profile Image" class="profile-image">
                <div style="display: flex; justify-content: center;">
                    <input type="file" name="profile_image" class="form-control-file">
                </div>
            </div>

            <hr>

            <div class="text-left">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Full Name"
                    value="{{ customer.user.get_full_name|default:customer.user.username }}">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email"
                    value="{{ customer.user.email }}">

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone"
                    value="{{ customer.phone }}">

                <label for="address">Address</label>
                <textarea id="address" name="address" class="form-control" placeholder="Address">{{ customer.address }}</textarea>

                <center><button type="submit" class="btn btn-save mt-2">Save Changes</button></center>
            </div>
        </div>
    </form>
</body>
</html>
