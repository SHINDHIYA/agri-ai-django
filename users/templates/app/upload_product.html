<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts, Bootstrap, and Font Awesome -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --medium-green: #c8e6c9;
            --dark-green: #1b5e20;
            --accent-green: #4caf50;
            --text-dark: #2d3436;
            --text-light: #f5f5f5;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        body {
            background: linear-gradient(135deg, #e0f2f1, #c8e6c9);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .upload-wrapper {
            width: 100%;
            max-width: 650px;
            background-color: #fff;
            padding: 40px 45px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border-left: 8px solid var(--primary-green);
            position: relative;
            overflow: hidden;
        }

        .upload-wrapper:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-green), var(--dark-green));
        }

        .upload-wrapper h2 {
            text-align: center;
            color: var(--primary-green);
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 2rem;
            position: relative;
        }

        .upload-wrapper h2::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--accent-green);
            border-radius: 2px;
        }

        form p {
            margin-bottom: 22px;
        }

        label {
            font-weight: 600;
            color: var(--primary-green);
            display: block;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0f2f1;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            background-color: #f9fdf9;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
            background-color: #fff;
        }

        .btn-success {
            background: linear-gradient(to right, var(--accent-green), var(--dark-green));
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(40, 167, 69, 0.6);
        }

        .home-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            background: linear-gradient(to right, var(--accent-green), var(--dark-green));
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            z-index: 100;
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(40, 167, 69, 0.5);
            text-decoration: none;
            color: white;
        }

        @media (max-width: 768px) {
            .upload-wrapper {
                padding: 30px;
            }

            .home-btn {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    
 <div id="google_translate_element" style="position: fixed; top: 10px; right: 10px; z-index: 9999;"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,ta',
    layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
  }, 'google_translate_element');
}
</script>

<script type="text/javascript"
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>


<a href="/" class="home-btn"><i class="fas fa-home"></i> Home</a>

<div class="upload-wrapper">
    <h2>Upload New Product</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">
            <i class="fas fa-cloud-upload-alt"></i> Upload Product
        </button>
    </form>
</div>

</body>
</html>
