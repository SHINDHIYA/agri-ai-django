<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Recommendation</title>

    <!-- Favicon -->
    <link rel="icon" href="static/images/icon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Thasadith&family=Mukta:wght@300&family=Varela+Round&family=Exo+2&family=Libre+Franklin:wght@600&display=swap" rel="stylesheet">
    
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            padding: 0;
            margin: 0;
            font-size: 10px;
            line-height: 20px;
            color: #b1b4bd;
            background-color: #798d76;
            overflow-y: scroll;
            overflow-x: hidden;
        }

        a {
            color: #b1b4bd; 
        }

        .navbar a:hover {
            color: black;
        }

        .header-background {
            position: static;
            display: block;
            overflow: visible;
            top: 0;
            height: auto;
            min-height: 550px;
            margin-bottom: 0px;
            padding-bottom: 70px;
            background: linear-gradient(180deg, rgba(121, 141, 118, 0.55), rgba(121, 141, 118, 0.74)), url('static/images/background.jpg') no-repeat center center/cover;
            flex-direction: column;
            white-space: normal;
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            padding: 10px;
            z-index: 1000;
            background-color: #4b4f4a;
        }

        .navbar-brand {
            color: #b1b4bd;
        }

        .collapse {
            font-family: 'Mukta', sans-serif;
            font-size: 15px;
        }

        .navbar-toggler {
            border: none;
            padding: 10px 6px;
            outline: none;
        }

        .navbar-toggler-icon {
            color: white;
        }

        .navbar-expand-lg .navbar-nav .nav-link.active {
            color: white;
        }

        .page-footer {
            color: black;
            padding-top: 15px;
            padding-bottom: 10px;
            text-align: center;
        }

        .foot {
            font-family: 'Varela Round', sans-serif;
        }

        .maps {
            background-color: white;
            font-family: 'Libre Franklin', sans-serif;
            text-align: center;
            color: black;
            padding-top: 30px;
            padding-bottom: 70px;
        }

        iframe {
            width: 100%;
            max-width: 640px;
            height: 480px;
            border: none;
        }

        .fert {
            background-color: white;
            padding-top: 100px;
            padding-bottom: 100px;
        }

        .fert-font {
            font-family: 'Thasadith', sans-serif;
            font-size: 30px;
            color: black;
            text-align: center;
            padding-top: 60px;
        }

        .move-top {
            width: 34px;
            height: 34px;
            background: url('static/images/back-to-top.png') no-repeat;
            display: inline-block;
            position: fixed;
            bottom: 4%;
            right: 2%;
            z-index: 1000; 
        }

        .predict {
            background-color: white;
            font-family: 'Libre Franklin', sans-serif;
            color: black;
            padding-top: 30px;
            padding-bottom: 50px;
        }

        .form-group {
            font-weight: bold;
            font-size: 17px;
        }

        .parameters {
            width: 350px;
            height: 40rem;
            margin: 0 auto;
            color: black;
            border-radius: 25px;
            padding: 20px;
            line-height: 40px;
        }

        .btn-predict {
            color: black;
            font-weight: bold;
            width: 130px;
            height: 50px;
            border-radius: 12px;
            font-size: 21px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar sticky-nav navbar-expand-lg navbar-transparent fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="static/images/logo.png" alt="logo" width="150">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon">&#9776;</span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
               
                </ul>
            </div>
        </div>
    </nav>

    <!-- Maps Section -->
    <section class="maps">
        <h1>Search Your Fertilizer Shop</h1>
        <iframe src="https://www.google.com/maps/d/embed?mid=1H663hXLDZUu3ICrEdVj9X2tcP7karcrC"></iframe>
    </section>

    <!-- Footer -->
    <footer class="page-footer">
        <div class="row text-center justify-content-center">
            <div class="col-md-3">
                <h3 class="foot">FERTILIZER RECOMMENDATION</h3>
                <hr>
                <h6>Made with 🖤</h6>
                <h6>© Copyright. All Rights Reserved.</h6>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.min.js"></script>

</body>
</html>
